openapi: 3.0.3
info:
  title: Vita Guia Mobile API
  version: 1.0.0
  description: API compartida para Android e iOS.
servers:
  - url: http://127.0.0.1:8082/api/v1
    description: Desarrollo en la PC
  - url: http://10.0.2.2:8082/api/v1
    description: Emulador Android
paths:
  /access/open:
    post:
      summary: Abre un enlace y crea o recupera la sesion de una instalacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAccessRequest'
      responses:
        '200':
          description: Sesion disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAccessResponse'
        '404':
          description: Enlace inexistente
        '410':
          description: Enlace no disponible
  /guide:
    get:
      summary: Obtiene temas, modulos y contenido publicado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Guia movil
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Bearer faltante o invalido
        '410':
          description: Acceso vencido o revocado
  /chat:
    post:
      summary: Consulta el buscador extractivo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Respuesta basada en contenido aprobado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
  /assets/{asset}:
    get:
      summary: Descarga o reproduce un recurso privado
      security:
        - bearerAuth: []
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Archivo
          content:
            application/pdf: {}
            image/jpeg: {}
            image/png: {}
            video/mp4: {}
        '401':
          description: Bearer faltante o invalido
        '404':
          description: Recurso inexistente o no publicado
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    OpenAccessRequest:
      type: object
      required: [token, client_id, platform]
      properties:
        token:
          type: string
        client_id:
          type: string
          minLength: 16
        platform:
          type: string
          enum: [android, ios]
        app_version:
          type: string
    OpenAccessResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            access_token:
              type: string
            token_type:
              type: string
              example: Bearer
            expires_at:
              type: string
              format: date-time
            platform:
              type: string
              enum: [android, ios]
            guide_path:
              type: string
              format: uri
    ChatRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          maxLength: 500
        scope:
          type: string
          enum: [all, health, business, mixed]
    ChatResponse:
      type: object
      properties:
        answer:
          type: string
        mode:
          type: string
          example: extractive
        notice:
          type: string
